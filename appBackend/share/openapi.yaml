openapi: 3.0.0
info:
  title: 'Timesheet backend application'
  description: 'Api Timesheet backend application'
  version: 1.0.0
paths:
  '/api/identity/users/{id}/group':
    patch:
      tags:
        - Identity
      summary: 'Изменить группу пользователя'
      description: 'Назначает пользователя в группу или снимает из группы.'
      operationId: patch_identity_change_user_group
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор пользователя.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\Identity\Infrastructure\Dto\ChangeUserGroupRequestDto
      responses:
        '204':
          description: 'Группа пользователя успешно изменена.'
        '404':
          description: 'Пользователь или группа не найдены.'
        '422':
          description: 'Нарушение бизнес-правил.'
  /api/identity/groups:
    get:
      tags:
        - Identity
      summary: 'Получить список групп'
      description: 'Возвращает список групп с пагинацией.'
      operationId: get_identity_list_groups
      parameters:
        -
          name: page
          in: query
          description: 'Номер страницы.'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: perPage
          in: query
          description: 'Количество элементов на странице.'
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Список групп.'
          content:
            application/json:
              schema:
                $ref: App\Identity\Infrastructure\Dto\GroupListResponseDto
    post:
      tags:
        - Identity
      summary: 'Создать группу'
      description: 'Создаёт новую группу пользователей.'
      operationId: post_identity_create_group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\Identity\Infrastructure\Dto\CreateGroupRequestDto
      responses:
        '201':
          description: 'Группа успешно создана.'
        '400':
          description: 'Невалидные данные запроса.'
        '422':
          description: 'Нарушение бизнес-правил.'
  /api/identity/users:
    get:
      tags:
        - Identity
      summary: 'Получить список пользователей'
      description: 'Возвращает список пользователей с пагинацией и фильтрацией.'
      operationId: get_identity_list_users
      parameters:
        -
          name: groupId
          in: query
          description: 'Фильтр по группе.'
          required: false
          schema:
            type: string
            format: uuid
        -
          name: roleId
          in: query
          description: 'Фильтр по роли.'
          required: false
          schema:
            type: string
            format: uuid
        -
          name: isActive
          in: query
          description: 'Фильтр по активности.'
          required: false
          schema:
            type: boolean
        -
          name: page
          in: query
          description: 'Номер страницы.'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: perPage
          in: query
          description: 'Количество элементов на странице.'
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Список пользователей.'
          content:
            application/json:
              schema:
                $ref: App\Identity\Infrastructure\Dto\UserListResponseDto
    post:
      tags:
        - Identity
      summary: 'Создать пользователя'
      description: 'Создаёт нового пользователя.'
      operationId: post_identity_create_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\Identity\Infrastructure\Dto\CreateUserRequestDto
      responses:
        '201':
          description: 'Пользователь успешно создан.'
        '400':
          description: 'Невалидные данные запроса.'
        '422':
          description: 'Нарушение бизнес-правил.'
  '/api/identity/users/{id}/deactivate':
    post:
      tags:
        - Identity
      summary: 'Деактивировать пользователя'
      description: 'Деактивирует учётную запись пользователя.'
      operationId: post_identity_deactivate_user
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор пользователя.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Пользователь успешно деактивирован.'
        '404':
          description: 'Пользователь не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
  '/api/identity/groups/{id}':
    put:
      tags:
        - Identity
      summary: 'Обновить группу'
      description: 'Обновляет данные существующей группы.'
      operationId: put_identity_update_group
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор группы.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\Identity\Infrastructure\Dto\UpdateGroupRequestDto
      responses:
        '204':
          description: 'Группа успешно обновлена.'
        '404':
          description: 'Группа не найдена.'
        '422':
          description: 'Нарушение бизнес-правил.'
    delete:
      tags:
        - Identity
      summary: 'Удалить группу'
      description: 'Выполняет мягкое удаление группы.'
      operationId: delete_identity_delete_group
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор группы.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Группа успешно удалена.'
        '404':
          description: 'Группа не найдена.'
        '422':
          description: 'Нарушение бизнес-правил.'
  '/api/identity/users/{id}':
    put:
      tags:
        - Identity
      summary: 'Обновить пользователя'
      description: 'Обновляет данные существующего пользователя.'
      operationId: put_identity_update_user
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор пользователя.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\Identity\Infrastructure\Dto\UpdateUserRequestDto
      responses:
        '204':
          description: 'Пользователь успешно обновлён.'
        '404':
          description: 'Пользователь не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
    delete:
      tags:
        - Identity
      summary: 'Удалить пользователя'
      description: 'Выполняет мягкое удаление пользователя.'
      operationId: delete_identity_delete_user
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор пользователя.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Пользователь успешно удалён.'
        '404':
          description: 'Пользователь не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
  /api/project-management/change-requests:
    get:
      tags:
        - ProjectManagement
      summary: 'Получить список запросов на изменение'
      description: 'Возвращает список запросов на изменение с пагинацией и фильтрацией.'
      operationId: get_project_management_list_change_requests
      parameters:
        -
          name: projectId
          in: query
          description: 'Фильтр по проекту.'
          required: false
          schema:
            type: string
            format: uuid
        -
          name: name
          in: query
          description: 'Фильтр по названию.'
          required: false
          schema:
            type: string
        -
          name: page
          in: query
          description: 'Номер страницы.'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: perPage
          in: query
          description: 'Количество элементов на странице.'
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Список запросов на изменение.'
          content:
            application/json:
              schema:
                $ref: App\ProjectManagement\Infrastructure\Dto\ChangeRequestListResponseDto
    post:
      tags:
        - ProjectManagement
      summary: 'Создать запрос на изменение'
      description: 'Создаёт новый запрос на изменение для указанного проекта.'
      operationId: post_project_management_create_change_request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\CreateChangeRequestRequestDto
      responses:
        '201':
          description: 'Запрос на изменение успешно создан.'
        '400':
          description: 'Невалидные данные запроса.'
        '404':
          description: 'Проект не найден.'
  /api/project-management/clients:
    get:
      tags:
        - ProjectManagement
      summary: 'Получить список клиентов'
      description: 'Возвращает список клиентов с пагинацией и фильтрацией.'
      operationId: get_project_management_list_clients
      parameters:
        -
          name: name
          in: query
          description: 'Фильтр по названию.'
          required: false
          schema:
            type: string
        -
          name: page
          in: query
          description: 'Номер страницы.'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: perPage
          in: query
          description: 'Количество элементов на странице.'
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Список клиентов.'
          content:
            application/json:
              schema:
                $ref: App\ProjectManagement\Infrastructure\Dto\ClientListResponseDto
    post:
      tags:
        - ProjectManagement
      summary: 'Создать клиента'
      description: 'Создаёт нового клиента.'
      operationId: post_project_management_create_client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\CreateClientRequestDto
      responses:
        '201':
          description: 'Клиент успешно создан.'
        '400':
          description: 'Невалидные данные запроса.'
  /api/project-management/projects:
    get:
      tags:
        - ProjectManagement
      summary: 'Получить список проектов'
      description: 'Возвращает список проектов с пагинацией и фильтрацией.'
      operationId: get_project_management_list_projects
      parameters:
        -
          name: clientId
          in: query
          description: 'Фильтр по клиенту.'
          required: false
          schema:
            type: string
            format: uuid
        -
          name: status
          in: query
          description: 'Фильтр по статусу.'
          required: false
          schema:
            type: string
            enum:
              - active
              - closed
        -
          name: page
          in: query
          description: 'Номер страницы.'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: perPage
          in: query
          description: 'Количество элементов на странице.'
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Список проектов.'
          content:
            application/json:
              schema:
                $ref: App\ProjectManagement\Infrastructure\Dto\ProjectListResponseDto
    post:
      tags:
        - ProjectManagement
      summary: 'Создать проект'
      description: 'Создаёт новый проект для указанного клиента.'
      operationId: post_project_management_create_project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\CreateProjectRequestDto
      responses:
        '201':
          description: 'Проект успешно создан.'
        '400':
          description: 'Невалидные данные запроса.'
        '404':
          description: 'Клиент не найден.'
  /api/project-management/tasks:
    get:
      tags:
        - ProjectManagement
      summary: 'Получить список задач'
      description: 'Возвращает список задач с пагинацией и фильтрацией.'
      operationId: get_project_management_list_tasks
      parameters:
        -
          name: projectId
          in: query
          description: 'Фильтр по проекту.'
          required: false
          schema:
            type: string
            format: uuid
        -
          name: crId
          in: query
          description: 'Фильтр по запросу на изменение.'
          required: false
          schema:
            type: string
            format: uuid
        -
          name: page
          in: query
          description: 'Номер страницы.'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: perPage
          in: query
          description: 'Количество элементов на странице.'
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Список задач.'
          content:
            application/json:
              schema:
                $ref: App\ProjectManagement\Infrastructure\Dto\TaskListResponseDto
    post:
      tags:
        - ProjectManagement
      summary: 'Создать задачу'
      description: 'Создаёт новую задачу для проекта или запроса на изменение.'
      operationId: post_project_management_create_task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\CreateTaskRequestDto
      responses:
        '201':
          description: 'Задача успешно создана.'
        '400':
          description: 'Невалидные данные запроса.'
        '404':
          description: 'Родительская сущность не найдена.'
        '422':
          description: 'Нарушение бизнес-правил.'
  '/api/project-management/change-requests/{id}':
    put:
      tags:
        - ProjectManagement
      summary: 'Обновить запрос на изменение'
      description: 'Обновляет данные существующего запроса на изменение.'
      operationId: put_project_management_update_change_request
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор запроса на изменение.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\UpdateChangeRequestRequestDto
      responses:
        '204':
          description: 'Запрос на изменение успешно обновлён.'
        '404':
          description: 'Запрос на изменение не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
    delete:
      tags:
        - ProjectManagement
      summary: 'Удалить запрос на изменение'
      description: 'Выполняет мягкое удаление запроса на изменение.'
      operationId: delete_project_management_delete_change_request
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор запроса на изменение.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Запрос на изменение успешно удалён.'
        '404':
          description: 'Запрос на изменение не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
  '/api/project-management/clients/{id}':
    put:
      tags:
        - ProjectManagement
      summary: 'Обновить клиента'
      description: 'Обновляет данные существующего клиента.'
      operationId: put_project_management_update_client
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор клиента.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\UpdateClientRequestDto
      responses:
        '204':
          description: 'Клиент успешно обновлён.'
        '404':
          description: 'Клиент не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
    delete:
      tags:
        - ProjectManagement
      summary: 'Удалить клиента'
      description: 'Выполняет мягкое удаление клиента.'
      operationId: delete_project_management_delete_client
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор клиента.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Клиент успешно удалён.'
        '404':
          description: 'Клиент не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
  '/api/project-management/projects/{id}':
    put:
      tags:
        - ProjectManagement
      summary: 'Обновить проект'
      description: 'Обновляет данные существующего проекта.'
      operationId: put_project_management_update_project
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор проекта.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\UpdateProjectRequestDto
      responses:
        '204':
          description: 'Проект успешно обновлён.'
        '404':
          description: 'Проект не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
    delete:
      tags:
        - ProjectManagement
      summary: 'Удалить проект'
      description: 'Выполняет мягкое удаление проекта.'
      operationId: delete_project_management_delete_project
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор проекта.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Проект успешно удалён.'
        '404':
          description: 'Проект не найден.'
        '422':
          description: 'Нарушение бизнес-правил.'
  '/api/project-management/tasks/{id}':
    put:
      tags:
        - ProjectManagement
      summary: 'Обновить задачу'
      description: 'Обновляет данные существующей задачи.'
      operationId: put_project_management_update_task
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор задачи.'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\ProjectManagement\Infrastructure\Dto\UpdateTaskRequestDto
      responses:
        '204':
          description: 'Задача успешно обновлена.'
        '404':
          description: 'Задача не найдена.'
        '422':
          description: 'Нарушение бизнес-правил.'
    delete:
      tags:
        - ProjectManagement
      summary: 'Удалить задачу'
      description: 'Выполняет мягкое удаление задачи.'
      operationId: delete_project_management_delete_task
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор задачи.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 'Задача успешно удалена.'
        '404':
          description: 'Задача не найдена.'
        '422':
          description: 'Нарушение бизнес-правил.'
  /api/reporting/reports:
    get:
      tags:
        - Reporting
      summary: 'Получить список отчётов'
      description: 'Возвращает список отчётов с пагинацией и опциональной фильтрацией.'
      operationId: get_reporting_list_reports
      parameters:
        -
          name: createdBy
          in: query
          description: 'Фильтр по автору.'
          required: false
          schema:
            type: string
            format: uuid
        -
          name: periodFrom
          in: query
          description: 'Фильтр по началу периода (Y-m-d).'
          required: false
          schema:
            type: string
            format: date
        -
          name: periodTo
          in: query
          description: 'Фильтр по окончанию периода (Y-m-d).'
          required: false
          schema:
            type: string
            format: date
        -
          name: name
          in: query
          description: 'Фильтр по названию (поиск подстроки).'
          required: false
          schema:
            type: string
        -
          name: page
          in: query
          description: 'Номер страницы.'
          required: false
          schema:
            type: integer
            default: 1
        -
          name: perPage
          in: query
          description: 'Количество элементов на странице.'
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 'Список отчётов.'
          content:
            application/json:
              schema:
                $ref: App\Reporting\Infrastructure\Dto\ReportListResponseDto
    post:
      tags:
        - Reporting
      summary: 'Создать отчёт'
      description: 'Создаёт новый отчёт по заданным параметрам и фильтрам.'
      operationId: post_reporting_create_report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: App\Reporting\Infrastructure\Dto\CreateReportRequestDto
      responses:
        '201':
          description: 'Отчёт успешно создан.'
        '400':
          description: 'Невалидные данные запроса.'
        '422':
          description: 'Ошибка бизнес-логики.'
  '/api/reporting/exports/{id}/download':
    get:
      tags:
        - Reporting
      summary: 'Скачать файл выгрузки'
      description: 'Возвращает файл выгрузки для указанной записи экспорта.'
      operationId: get_reporting_download_export
      parameters:
        -
          name: id
          in: path
          description: 'Идентификатор выгрузки.'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Файл выгрузки.'
        '404':
          description: 'Выгрузка не найдена.'
  /api/reporting/exports:
    get:
      tags:
        - Reporting
      summary: 'Получить список выгрузок'
      description: 'Возвращает список выгрузок отчётов с пагинацией и опциональной фильтрацией.'
      operationId: get_reporting_list_exported_reports
      parameters:
        -
          name: format
          in: query
