deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*DataFixtures.*#'
        - '#.*test.*#'
    layers:
        -
            name: Domain
            collectors:
                -
                    type: classLike
                    value: 'App\\(Identity|ProjectManagement|Reporting|Timesheet|WorkCatalog)\\Domain\\'
        -
            name: Application
            collectors:
                -
                    type: classLike
                    value: 'App\\(Identity|ProjectManagement|Reporting|Timesheet|WorkCatalog)\\Application\\'
        -
            name: Infrastructure
            collectors:
                -
                    type: classLike
                    value: 'App\\(Identity|ProjectManagement|Reporting|Timesheet|WorkCatalog)\\Infrastructure\\'
        -
            name: Shared
            collectors:
                -
                    type: classLike
                    value: 'App\\Shared\\'
        -
            name: Persistence
            collectors:
                -
                    type: classLike
                    value: 'App\\Persistence\\'
        -
            name: Kernel
            collectors:
                -
                    type: classLike
                    value: '^App\\Kernel$'
    ruleset:
        Domain: ~
        Application:
            - Domain
        Infrastructure:
            - Application
            - Domain
            - Persistence
            - Shared
        Shared:
            - Persistence
        Persistence: ~
        Kernel:
            - Infrastructure
            - Application
            - Domain
            - Persistence
            - Shared
