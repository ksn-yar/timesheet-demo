; =============================================================================
; PHP 8.4 — конфигурация для разработки corpo-timesheet
; =============================================================================

[PHP]
; Ошибки — полное отображение для разработки
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Память и лимиты
memory_limit = 256M
max_execution_time = 25
max_input_time = 25
post_max_size = 64M
upload_max_filesize = 64M

; OPcache — включён, но с валидацией для разработки
[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug
[xdebug]
xdebug.mode = ${PHP_XDEBUG_MODE}
xdebug.client_host = ${PHP_XDEBUG_CLIENT_HOST}
xdebug.client_port = ${PHP_XDEBUG_CLIENT_PORT}
xdebug.start_with_request = trigger
xdebug.idekey = PHPSTORM

; Session
[Session]
session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=${REDIS_PASSWORD}"

; Часовой пояс
date.timezone = UTC
