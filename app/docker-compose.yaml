################################################################################
# corpo-timesheet — Docker Compose
# Вариант 1: PostgreSQL + Redis + RabbitMQ
################################################################################

services:
  # ---------------------------------------------------------------------------
  # PHP-FPM (приложение)
  # ---------------------------------------------------------------------------
  corpo-ts-backend:
    container_name: corpo-ts-backend
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
      - ./docker/backend/php.ini:/usr/local/etc/php/conf.d/99-custom.ini:ro
    environment:
      PHP_XDEBUG_MODE: ${PHP_XDEBUG_MODE}
      PHP_XDEBUG_CLIENT_HOST: ${PHP_XDEBUG_CLIENT_HOST}
      PHP_XDEBUG_CLIENT_PORT: ${PHP_XDEBUG_CLIENT_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env
    depends_on:
      corpo-ts-db:
        condition: service_healthy
      corpo-ts-redis:
        condition: service_healthy
      corpo-ts-rabbitmq:
        condition: service_healthy
    networks:
      - corpo-ts

  # ---------------------------------------------------------------------------
  # Nginx (веб-сервер)
  # ---------------------------------------------------------------------------
  corpo-ts-nginx:
    container_name: corpo-ts-nginx
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - .:/var/www/app:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./var/logNginx:/var/log/nginx/app
    depends_on:
      - corpo-ts-backend
    networks:
      - corpo-ts

  # ---------------------------------------------------------------------------
  # PostgreSQL 17
  # ---------------------------------------------------------------------------
  corpo-ts-db:
    container_name: corpo-ts-db
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/_data/db:/var/lib/postgresql/data
      - ./docker/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - corpo-ts

  # ---------------------------------------------------------------------------
  # Redis 7.4
  # ---------------------------------------------------------------------------
  corpo-ts-redis:
    container_name: corpo-ts-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - corpo-ts

  # ---------------------------------------------------------------------------
  # RabbitMQ 4.0 (с Management UI)
  # ---------------------------------------------------------------------------
  corpo-ts-rabbitmq:
    container_name: corpo-ts-rabbitmq
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - corpo-ts

  # ---------------------------------------------------------------------------
  # MailHog (перехват email)
  # ---------------------------------------------------------------------------
  corpo-ts-mailhog:
    container_name: corpo-ts-mailhog
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"
    networks:
      - corpo-ts

networks:
  corpo-ts:
    driver: bridge

volumes:
  redis-data:
  rabbitmq-data:
