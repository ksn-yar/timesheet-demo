# =============================================================================
# PostgreSQL 17 — конфигурация для разработки corpo-timesheet
# =============================================================================

# Подключения
listen_addresses = '*'
max_connections = 100

# Память (адаптировано под dev-окружение)
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB

# WAL
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# Логирование (расширенное для разработки)
log_statement = 'all'
log_duration = on
log_min_duration_statement = 100
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'UTC'

# Locale
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# UUID — встроенная поддержка (расширение pgcrypto или gen_random_uuid из core)
# gen_random_uuid() доступен из коробки в PG 13+
