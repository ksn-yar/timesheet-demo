server {
    listen 80;
    server_name localhost;
    root /var/www/app/public;

    # Логи с форматом, включающим дату — для ротации по суткам
    access_log /var/log/nginx/app/access.log combined;
    error_log  /var/log/nginx/app/error.log warn;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass corpo-ts-backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Таймауты для тяжёлых операций (генерация отчётов)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        internal;
    }

    # Запрет доступа к .php-файлам напрямую (кроме index.php)
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 64M;
}
